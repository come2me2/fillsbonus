#:schema https://docs.onreza.ru/schemas/onreza-project-v1.schema.json
# Деплой на ONREZA (серверы в Москве). Инструкция: integrations/ONREZA_SETUP.md
# Production сейчас на VPS: https://fillsbonus.ru — см. integrations/SELF_HOSTED.md

[project]
name = "fillsbonus"
framework = "next"

[build]
command = "npm run onreza-build"
output_directory = ".next"

[deploy]
# process = Node.js standalone (не Edge / isolate)
compute = "process"
entry = ".next/standalone/server.js"

[env.declarations]
DATABASE_URL = { visibility = "sensitive", required = false }
AUTH_SECRET = { visibility = "sensitive", required = false }
ADMIN_EMAILS = { visibility = "plain", required = false }
ADMIN_EMAIL = { visibility = "plain", required = false }
NEXT_PUBLIC_SITE_URL = { visibility = "plain", required = false }
NEXT_PUBLIC_BONUS_URL = { visibility = "plain", required = false }
TILDA_WEBHOOK_SECRET = { visibility = "sensitive", required = false }
TELEGRAM_BOT_TOKEN = { visibility = "sensitive", required = false }
TELEGRAM_CHAT_ID = { visibility = "sensitive", required = false }
POSTGRES_PRISMA_URL = { visibility = "sensitive", required = false }
POSTGRES_URL_NON_POOLING = { visibility = "sensitive", required = false }
POSTGRES_URL = { visibility = "sensitive", required = false }
